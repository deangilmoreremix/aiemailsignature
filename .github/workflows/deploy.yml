name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (build + audit + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate every production push through the same combined gate used in CI:
      # build (type-check) -> audit (real APIs, no mock data) -> tests. The
      # integration suite self-skips without OPENAI_API_KEY, which is correctly
      # withheld from CI.
      - name: Verify (build + audit + test)
        run: npm run verify

  build-image:
    name: Build production Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    # Only build the image on direct pushes to main; workflow_dispatch runs that
    # target other refs stay lightweight.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # Builds and validates the Dockerfile in CI. The image is tagged with
        # the commit SHA and remains available in the runner even if no push
        # happens.
        run: docker build -t openai-real-api-app:${{ github.sha }} .

      # Optional push to GitHub Container Registry. Setting the GHCR_TOKEN secret
      # (and granting the workflow `packages: write`) enables pushing to
      # ghcr.io/${{ github.repository }}. If the secret is absent, this step is
      # skipped and the job still succeeds because the image was already built
      # and verified above.
      - name: Log in to GHCR and push
        if: ${{ secrets.GHCR_TOKEN != '' }}
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=ghcr.io/${{ github.repository }}
          docker tag openai-real-api-app:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag openai-real-api-app:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
